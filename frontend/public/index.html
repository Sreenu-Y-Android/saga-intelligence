            flex-direction: column;
            gap: 16px;

            letter-spacing: 0.18em;
            z-index: 99999;
        }

        #initial-tdp-splash .ring {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 4px solid rgba(255, 231, 179, 0.35);
            border-top-color: #FFE7B3;
            animation: tdpSplashSpin 0.9s linear infinite;
        }

        #initial-tdp-splash h1 {
            margin: 0;
            font-weight: 800;
            font-size: 20px;
            text-transform: uppercase;
        }

        #initial-tdp-splash p {
            margin: 0;
            font-size: 11px;
            opacity: 0.8;
            letter-spacing: 0.3em;
        }

        @keyframes tdpSplashSpin {

                transform: rotate(360deg);

        }

        // Remove splash once React mounts content into #root
        (function () {
            var maxWait = 12000;
            var start = Date.now();
            var iv = setInterval(function () {
                var root = document.getElementById('root');
                if ((root && root.children.length > 0) || Date.now() - start > maxWait) {
                    var splash = document.getElementById('initial-tdp-splash');
                    if (splash) {
                        splash.style.transition = 'opacity 0.45s ease';
                        splash.style.opacity = '0';
                        setTimeout(function () { splash && splash.remove(); }, 480);
                    }
                    clearInterval(iv);
                }
            }, 120);
        })();
    </script>
